name: Release addon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version and changelog
        env:
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: node scripts/prepare-release.mts "$RELEASE_TAG" "$RELEASE_NOTES"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Package TOC modules and assets from the tagged commit
        env:
          RELEASE_ZIP: ${{ runner.temp }}/Raidwise-${{ inputs.tag || github.ref_name }}.zip
        run: node scripts/package-addon.mts "$RELEASE_ZIP"
      - name: Publish release and installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
          RELEASE_ZIP: ${{ runner.temp }}/Raidwise-${{ inputs.tag || github.ref_name }}.zip
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ZIP" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ZIP" \
              --verify-tag \
              --title "Raidwise $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES" \
              --repo "$GITHUB_REPOSITORY"
          fi
